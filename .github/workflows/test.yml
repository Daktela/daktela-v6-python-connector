name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -c requirements-dev.txt -e ".[dev]"

      - name: Run tests
        run: pytest --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  minimum-dependencies:
    # Verifies the declared lower bounds: the oldest supported Python and httpx.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the minimum httpx
        run: pip install "httpx==0.27.0" -e ".[dev]"

      - name: Run tests
        run: pytest

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -c requirements-dev.txt -e ".[dev]"

      - name: Run mypy
        run: mypy src/daktela

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -c requirements-dev.txt ruff

      - name: Run ruff
        run: ruff check src/ tests/ examples/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install -c requirements-dev.txt build twine

      - name: Build and inspect package
        env:
          # Pins the build backend in the isolated build environment.
          PIP_CONSTRAINT: requirements-dev.txt
        run: |
          python -m build
          twine check dist/*

  live:
    # Runs against a real instance with the secrets of the protected `live`
    # environment (restrict it to the main branch in the repository settings);
    # the tests skip themselves when the secrets are not configured.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -c requirements-dev.txt -e ".[dev]"

      - name: Run live integration tests
        env:
          DAKTELA_URL: ${{ secrets.DAKTELA_URL }}
          DAKTELA_ACCESS_TOKEN: ${{ secrets.DAKTELA_ACCESS_TOKEN }}
          DAKTELA_USERNAME: ${{ secrets.DAKTELA_USERNAME }}
          DAKTELA_PASSWORD: ${{ secrets.DAKTELA_PASSWORD }}
          DAKTELA_RECORDING_ACTIVITY: ${{ secrets.DAKTELA_RECORDING_ACTIVITY }}
        run: pytest tests/integration --no-cov -rs
