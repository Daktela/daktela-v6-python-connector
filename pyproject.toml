[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daktela"
version = "1.1.0"
description = "Python SDK for Daktela V6 REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Daktela" }
]
keywords = ["daktela", "api", "sdk", "rest", "contact-center"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Daktela/daktela-v6-python-connector"
Documentation = "https://github.com/Daktela/daktela-v6-python-connector#readme"
Repository = "https://github.com/Daktela/daktela-v6-python-connector"
Issues = "https://github.com/Daktela/daktela-v6-python-connector/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/daktela"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=daktela --cov-branch --cov-report=term-missing --cov-fail-under=100"
